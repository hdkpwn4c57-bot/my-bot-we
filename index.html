<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OG Horizontal UD - Stats & MM</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #f4f4f6;
            --header-green: #8fd19e;
            --sub-green: #b7e4c7;
            --dark-green: #1b4332;
            --player-blue: #3498db;
            --banker-red: #e74c3c;
            --tie-green: #2ecc71;
            --skip-orange: #f39c12;
            --wait-gray: #7f8c8d;
            --stake-dark: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .top-bar {
            background: #fff;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            font-size: 15px;
        }

        .top-icons span {
            margin-left: 12px;
            cursor: pointer;
            font-size: 18px;
        }

        /* Road Tabs */
        .road-tabs {
            display: flex;
            background: var(--sub-green);
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }

        .road-tab {
            flex: 1;
            padding: 6px;
            border-bottom: 3px solid transparent;
        }

        .road-tab.active {
            border-bottom: 3px solid var(--dark-green);
            background: var(--header-green);
        }

        /* Big Road Canvas Area */
        .roadmap-container {
            flex: 1;
            background: #fff;
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid #ccc;
            padding: 8px;
            position: relative;
        }

        .road-grid {
            display: grid;
            grid-template-rows: repeat(6, 22px);
            grid-auto-flow: column;
            grid-auto-columns: 22px;
            gap: 2px;
        }

        .road-cell {
            width: 22px;
            height: 22px;
            border: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .circle-P {
            width: 18px;
            height: 18px;
            border: 3px solid var(--player-blue);
            border-radius: 50%;
        }

        .circle-B {
            width: 18px;
            height: 18px;
            border: 3px solid var(--banker-red);
            border-radius: 50%;
        }

        .tie-slash {
            position: absolute;
            width: 16px;
            height: 2px;
            background-color: var(--tie-green);
            transform: rotate(-45deg);
        }

        /* Skip History Pills */
        .skip-bar {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            padding: 4px 10px;
            background: #fff;
        }

        .skip-pill {
            width: 32px;
            height: 18px;
            background: #888;
            color: #fff;
            border-radius: 9px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr 1fr;
            gap: 3px;
            padding: 4px 6px;
            background: #fff;
            text-align: center;
        }

        .stat-box {
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        .stat-header {
            font-size: 11px;
            padding: 3px;
            color: #fff;
            font-weight: 600;
        }

        .bg-green-light { background: var(--header-green); color: #111; }
        .bg-blue { background: var(--player-blue); }
        .bg-red { background: var(--banker-red); }
        .bg-green { background: var(--tie-green); }

        .stat-val {
            font-size: 13px;
            padding: 4px;
            font-weight: bold;
            background: #fff;
        }

        /* Signal & Stake Banner */
        .signal-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 2px 6px;
        }

        .signal-box {
            border-radius: 6px;
            padding: 8px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 62px;
            transition: background 0.2s;
        }

        .signal-wait { background: var(--wait-gray); }
        .signal-P { background: var(--player-blue); }
        .signal-B { background: var(--banker-red); }
        .stake-box { background: var(--stake-dark); text-align: center; justify-content: center; }

        .signal-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            opacity: 0.9;
        }

        .signal-main {
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Step Progression */
        .step-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 2px 6px;
        }

        .step-box {
            border-radius: 4px;
            overflow: hidden;
            text-align: center;
            border: 1px solid #ccc;
        }

        .step-title {
            background: var(--sub-green);
            font-size: 11px;
            padding: 2px;
            font-weight: 600;
        }

        .step-val {
            background: #fff;
            font-size: 13px;
            padding: 4px;
            font-weight: bold;
        }

        .step-active .step-title { background: var(--dark-green); color: #fff; }
        .step-active .step-val { background: #2d6a4f; color: #fff; }

        /* Balance Row */
        .balance-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 4px 6px;
        }

        /* Bottom Controls */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 10px 20px;
            background: #f8f9fa;
            border-top: 1px solid #ddd;
        }

        .btn-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .btn-circle:active {
            transform: scale(0.92);
        }

        .btn-P { background: var(--player-blue); }
        .btn-B { background: var(--banker-red); }
        .btn-T { background: var(--tie-green); }
        .btn-S { background: var(--skip-orange); }
        .btn-R { background: var(--dark-green); font-size: 14px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>☰ &nbsp; OG Horizontal UD</div>
        <div class="top-icons">
            <span onclick="undoLast()" title="ย้อนกลับ">↩️</span>
            <span onclick="configSettings()" title="ตั้งค่าทุน">⚙️</span>
        </div>
    </div>

    <div class="road-tabs">
        <div class="road-tab active">Big Road</div>
        <div class="road-tab">Bead Road</div>
    </div>

    <div class="roadmap-container">
        <div class="road-grid" id="roadGrid"></div>
    </div>

    <div class="skip-bar" id="skipBar">
        <div class="skip-pill">-</div>
        <div class="skip-pill">-</div>
        <div class="skip-pill">-</div>
        <div class="skip-pill">-</div>
        <div class="skip-pill">-</div>
        <div class="skip-pill">-</div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-header bg-green-light">Parity</div>
            <div class="stat-val" id="parityVal">0 : 0 : 0</div>
        </div>
        <div class="stat-box">
            <div class="stat-header bg-blue">Player</div>
            <div class="stat-val" id="pCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-header bg-red">Banker</div>
            <div class="stat-val" id="bCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-header bg-green">Tie</div>
            <div class="stat-val" id="tCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-header bg-green-light">Hand</div>
            <div class="stat-val" id="handCount">0</div>
        </div>
    </div>

    <div class="signal-row">
        <div class="signal-box signal-wait" id="signalBox">
            <div class="signal-meta">
                <span id="strategyLabel">CHOP</span>
                <span id="statusLabel">OFF</span>
            </div>
            <div class="signal-main" id="signalText">WAIT</div>
            <div class="signal-meta">
                <span>RIGEL MM</span>
